<!--

If you are reading this...

Have an amazing day ❤️

- Byte

-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610">
  <defs>
    <style>
      
    
    @keyframes floatAscii {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    
    @keyframes revealLine {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes scanlineSweep {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { transform: translateY(320px); opacity: 0.2; }
    }

    @keyframes gradientShift {
      0% { stop-color: #7C3AED; }
      50% { stop-color: #22D3EE; }
      100% { stop-color: #7C3AED; }
    }

    .ascii-container {
      animation: floatAscii 6s ease-in-out infinite;
    }

    .ascii-line {
      font-family: 'Fira Code', Consolas, Monaco, monospace;
      font-size: 22px;
      font-weight: bold;
      fill: url(#darkAsciiGrad);
      opacity: 0;
      animation: revealLine 0.5s forwards ease-out;
    }

    .scanline {
      width: 380px;
      height: 2px;
      fill: #22D3EE;
      opacity: 0.3;
      filter: blur(1px);
      animation: scanlineSweep 4s linear infinite;
    }
  
    
    @keyframes typingText {
      0%, 20% { width: 0; }
      50%, 80% { width: 100%; }
      100% { width: 0; }
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .term-title {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 32px;
      font-weight: 800;
      fill: #F8FAFC;
    }

    .term-sub {
      font-family: 'Fira Code', monospace;
      font-size: 18px;
      font-weight: 600;
      fill: #22D3EE;
    }

    .info-label {
      font-family: system-ui, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #94A3B8;
    }

    .info-val {
      font-family: system-ui, sans-serif;
      font-size: 13px;
      font-weight: 500;
      fill: #F8FAFC;
    }

    .pill-bg {
      fill: #0F172A;
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 1px;
      transition: all 0.3s ease;
    }

    .pill-text {
      font-family: system-ui, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #F8FAFC;
    }

    .cursor-blink {
      fill: #22D3EE;
      animation: blink 0.8s infinite;
    }
  

    @keyframes shimmer {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 1000; }
    }

    .bg-main {
      fill: #030712;
    }

    .shimmer-border {
      stroke: url(#shimmerGrad);
      stroke-width: 1.5px;
      fill: none;
      stroke-dasharray: 200 800;
      animation: shimmer 12s linear infinite;
    }
  
    </style>
  </defs>
  
    <!-- Background Canvas 1180x610 -->
    <rect width="1180" height="610" rx="24" class="bg-main" />

    <!-- Shimmer Glowing Border -->
    <defs>
      <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.8" />
        <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.8" />
        <stop offset="100%" stop-color="#10B981" stop-opacity="0.8" />
      </linearGradient>
    </defs>
    
    <rect width="1178" height="608" x="1" y="1" rx="23" class="shimmer-border" />

    <!-- Ambient Radial Glows -->
    <circle cx="200" cy="150" r="250" fill="#7C3AED" opacity="0.08" filter="blur(60px)" />
    <circle cx="900" cy="450" r="300" fill="#22D3EE" opacity="0.08" filter="blur(80px)" />

    <!-- Components -->
    
    <g transform="translate(40, 70)" class="ascii-container">
      <!-- Gradiente animado para el ASCII -->
      <defs>
        <linearGradient id="darkAsciiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#7C3AED">
            <animate attributeName="stop-color" values="#7C3AED; #22D3EE; #10B981; #7C3AED" dur="8s" repeatCount="indefinite" />
          </stop>
          <stop offset="100%" stop-color="#22D3EE">
            <animate attributeName="stop-color" values="#22D3EE; #10B981; #7C3AED; #22D3EE" dur="8s" repeatCount="indefinite" />
          </stop>
        </linearGradient>
      </defs>

      <!-- Panel Glass del ASCII (Lado Izquierdo) -->
      <rect width="380" height="470" rx="16" fill="#0F172A" fill-opacity="0.6" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      
      <!-- Scanline Sweeper -->
      <rect class="scanline" x="0" y="20" />

      <!-- Renderizado ASCII de Byte -->
      <g transform="translate(60, 150)">
        
      <text x="0" y="0" class="ascii-line" style="animation-delay: 0.0s;">
        &#160;&#160;&#160;/\_____/\&#160;&#160;&#160;
      </text>
    
      <text x="0" y="26" class="ascii-line" style="animation-delay: 0.3s;">
        &#160;&#160;/&#160;&#160;o&#160;&#160;&#160;o&#160;&#160;\&#160;&#160;
      </text>
    
      <text x="0" y="52" class="ascii-line" style="animation-delay: 0.6s;">
        &#160;(&#160;==&#160;&#160;^&#160;&#160;==&#160;)&#160;
      </text>
    
      <text x="0" y="78" class="ascii-line" style="animation-delay: 0.9s;">
        &#160;&#160;)&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;(&#160;&#160;
      </text>
    
      <text x="0" y="104" class="ascii-line" style="animation-delay: 1.2s;">
        &#160;(&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;)&#160;
      </text>
    
      <text x="0" y="130" class="ascii-line" style="animation-delay: 1.5s;">
        &#160;&#160;(&#160;&#160;||&#160;||&#160;&#160;)&#160;&#160;
      </text>
    
      <text x="0" y="156" class="ascii-line" style="animation-delay: 1.8s;">
        &#160;&#160;(__||_||__)&#160;&#160;
      </text>
    
      </g>

      <!-- Subtítulo de Byte -->
      <text x="190" y="380" text-anchor="middle" font-family="'Fira Code', monospace" font-size="12" fill="#94A3B8">
        [ Byte Cyber-Mascot v2.0 ]
      </text>
    </g>
  
    
    <g transform="translate(440, 70)">
      <!-- Panel Glass Derecho -->
      <rect width="700" height="470" rx="16" fill="#0F172A" fill-opacity="0.6" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

      <g transform="translate(40, 45)">
        <!-- Greeting -->
        <text y="0" class="term-title">Hola 👋, soy Miguel</text>
        
        <!-- Animated Role Typing -->
        <g transform="translate(0, 35)">
          <text y="0" class="term-sub">❯ Software Developer</text>
          <rect x="230" y="-14" width="8" height="18" class="cursor-blink" />
        </g>

        <!-- Information List -->
        <g transform="translate(0, 80)">
          <text y="0">
            <tspan class="info-label">📍 Ubicación: </tspan>
            <tspan class="info-val">Apizaco, Tlaxcala, México</tspan>
          </text>
          <text y="28">
            <tspan class="info-label">🎓 Formación: </tspan>
            <tspan class="info-val">Ingeniería en Desarrollo de Software</tspan>
          </text>
          <text y="56">
            <tspan class="info-label">🎯 Enfoque Actual: </tspan>
            <tspan class="info-val">Sistemas SaaS & Gestión de Emergencias</tspan>
          </text>
        </g>

        <!-- Tech Stack Section -->
        <g transform="translate(0, 200)">
          <text y="-12" class="info-label" style="letter-spacing: 1px;">TECNOLOGÍAS &amp; STACK</text>
          <g transform="translate(0, 10)">
            
      <g transform="translate(0, 0)" class="skill-pill">
        <rect width="78" height="28" rx="14" class="pill-bg" />
        <text x="39" y="18" text-anchor="middle" class="pill-text">Svelte</text>
      </g>
    
      <g transform="translate(88, 0)" class="skill-pill">
        <rect width="114" height="28" rx="14" class="pill-bg" />
        <text x="57" y="18" text-anchor="middle" class="pill-text">JavaScript</text>
      </g>
    
      <g transform="translate(212, 0)" class="skill-pill">
        <rect width="87" height="28" rx="14" class="pill-bg" />
        <text x="43.5" y="18" text-anchor="middle" class="pill-text">Node.js</text>
      </g>
    
      <g transform="translate(309, 0)" class="skill-pill">
        <rect width="87" height="28" rx="14" class="pill-bg" />
        <text x="43.5" y="18" text-anchor="middle" class="pill-text">Express</text>
      </g>
    
      <g transform="translate(406, 0)" class="skill-pill">
        <rect width="114" height="28" rx="14" class="pill-bg" />
        <text x="57" y="18" text-anchor="middle" class="pill-text">PostgreSQL</text>
      </g>
    
      <g transform="translate(530, 0)" class="skill-pill">
        <rect width="87" height="28" rx="14" class="pill-bg" />
        <text x="43.5" y="18" text-anchor="middle" class="pill-text">Flutter</text>
      </g>
    
      <g transform="translate(0, 36)" class="skill-pill">
        <rect width="60" height="28" rx="14" class="pill-bg" />
        <text x="30" y="18" text-anchor="middle" class="pill-text">Dart</text>
      </g>
    
      <g transform="translate(70, 36)" class="skill-pill">
        <rect width="78" height="28" rx="14" class="pill-bg" />
        <text x="39" y="18" text-anchor="middle" class="pill-text">Python</text>
      </g>
    
      <g transform="translate(158, 36)" class="skill-pill">
        <rect width="51" height="28" rx="14" class="pill-bg" />
        <text x="25.5" y="18" text-anchor="middle" class="pill-text">Git</text>
      </g>
    
          </g>
        </g>

        <!-- Social Icons Bottom -->
        <g transform="translate(0, 350)">
          <text y="0" class="info-val" opacity="0.8">🔗 github.com/Mikee0102</text>
        </g>
      </g>
    </g>
  
  
</svg>