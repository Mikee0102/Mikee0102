<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 340" width="850" height="340">
  <defs>
    <style>
      
    
    @keyframes floatParticle {
      0% { transform: translateY(0px) scale(1); opacity: 0.3; }
      50% { transform: translateY(-12px) scale(1.2); opacity: 0.8; }
      100% { transform: translateY(0px) scale(1); opacity: 0.3; }
    }
    .particle {
      fill: #58a6ff;
      animation: floatParticle 6s ease-in-out infinite;
    }
    .p1 { animation-delay: 0s; }
    .p2 { animation-delay: 2s; }
    .p3 { animation-delay: 4s; }
  
    
    .glass-panel {
      fill: rgba(22, 27, 34, 0.75);
      stroke: rgba(48, 54, 61, 0.8);
      stroke-width: 1.2px;
      filter: drop-shadow(0px 8px 16px rgba(0, 0, 0, 0.25));
    }
  
    
    .term-header { fill: rgba(48, 54, 61, 0.8); opacity: 0.4; }
    .btn-close { fill: #ff5f56; }
    .btn-min { fill: #ffbd2e; }
    .btn-max { fill: #27c93f; }
    .term-title { fill: #8b949e; font-family: monospace; font-size: 11px; }
    .term-text { font-family: 'Fira Code', Consolas, Monaco, monospace; font-size: 13px; }
    .term-prompt { fill: #58a6ff; font-weight: bold; }
    .term-cmd { fill: #f0f6fc; }
    .term-output { fill: #7ee787; }
    .term-dim { fill: #8b949e; opacity: 0.8; }
    
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor { fill: #58a6ff; animation: blinkCursor 1s infinite; }
  
    
    .skill-badge {
      fill: rgba(22, 27, 34, 0.75);
      stroke: rgba(48, 54, 61, 0.8);
      stroke-width: 1px;
      rx: 6px;
    }
    .skill-text {
      fill: #f0f6fc;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 600;
    }
  
    
    
    @keyframes coffeeSteam {
      0% { transform: translateY(0) scaleX(1); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(-8px) scaleX(1.3); opacity: 0; }
    }
    .steam {
      stroke: #8b949e;
      stroke-width: 1.2;
      stroke-linecap: round;
      fill: none;
      animation: coffeeSteam 3s ease-in-out infinite;
    }
    .steam-2 { animation-delay: 1.5s; }
  

    @keyframes thoughtCycle {
      0%, 18% { opacity: 0; transform: translateY(4px); }
      22%, 36% { opacity: 1; transform: translateY(0); }
      40%, 100% { opacity: 0; transform: translateY(-4px); }
    }

    .thought-bubble {
      fill: #161b22;
      stroke: rgba(48, 54, 61, 0.8);
      stroke-width: 1.2px;
      filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.15));
    }

    .thought-text {
      font-family: 'Fira Code', Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #58a6ff;
      text-anchor: middle;
    }

    .thought-sub {
      font-family: system-ui, sans-serif;
      font-size: 10px;
      fill: #f0f6fc;
      text-anchor: middle;
    }

    .t-step-1 { animation: thoughtCycle 16s infinite 0s; }
    .t-step-2 { animation: thoughtCycle 16s infinite 4s; }
    .t-step-3 { animation: thoughtCycle 16s infinite 8s; }
    .t-step-4 { animation: thoughtCycle 16s infinite 12s; }

    @keyframes tailWag {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(6deg); }
    }
    .cat-tail {
      transform-origin: 190px 185px;
      animation: tailWag 4s ease-in-out infinite;
    }
  
  
    </style>
  </defs>
  
    
    <!-- Background Base -->
    <rect width="100%" height="100%" fill="#0d1117" rx="16" />
    
    <!-- Grid Pattern -->
    <defs>
      <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
        <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(48, 54, 61, 0.8)" stroke-width="0.5" opacity="0.3" />
      </pattern>
      <radialGradient id="glow" cx="50%" cy="0%" r="70%">
        <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.15" />
        <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
      </radialGradient>
    </defs>
    
    <rect width="100%" height="100%" fill="url(#grid)" rx="16" />
    <rect width="100%" height="100%" fill="url(#glow)" rx="16" />
  
    
    <!-- Floating Particles -->
    <g class="particles">
      <circle cx="80" cy="70" r="2" class="particle p1" />
      <circle cx="320" cy="40" r="1.5" class="particle p2" />
      <circle cx="500" cy="90" r="2.5" class="particle p3" />
      <circle cx="780" cy="60" r="1.8" class="particle p1" />
      <circle cx="420" cy="280" r="2" class="particle p2" />
    </g>
  
    
    <!-- Terminal Box -->
    <g transform="translate(30, 30)">
      <rect width="460" height="230" rx="10" fill="#161b22" stroke="rgba(48, 54, 61, 0.8)" stroke-width="1" />
      
      <!-- Terminal Header -->
      <path d="M 0 10 Q 0 0 10 0 L 450 0 Q 460 0 460 10 L 460 30 L 0 30 Z" class="term-header" />
      <circle cx="18" cy="15" r="5" class="btn-close" />
      <circle cx="34" cy="15" r="5" class="btn-min" />
      <circle cx="50" cy="15" r="5" class="btn-max" />
      <text x="230" y="19" text-anchor="middle" class="term-title">bash - Mikee0102@gitprofile-studio</text>

      <!-- Terminal Lines -->
      <g transform="translate(18, 55)" class="term-text">
        <!-- Line 1: Command -->
        <text y="0">
          <tspan class="term-prompt">❯ </tspan>
          <tspan class="term-cmd">whoami</tspan>
        </text>
        <!-- Line 2: Output -->
        <text y="22" class="term-output">✨ Miguel Angel Conde Vazquez</text>

        <!-- Line 3: Command -->
        <text y="50">
          <tspan class="term-prompt">❯ </tspan>
          <tspan class="term-cmd">git status</tspan>
        </text>
        <text y="72" class="term-dim">On branch main</text>
        <text y="92" class="term-dim">Your branch is up to date with 'origin/main'.</text>
        <text y="112" class="term-output">Status: Building awesome software 🚀</text>

        <!-- Line 4: Active prompt -->
        <text y="142">
          <tspan class="term-prompt">❯ </tspan>
          <tspan class="term-cmd">cat role.txt</tspan>
        </text>
        <text y="164" class="term-dim">Software Developer &amp; Architecture Student</text>
        
        <text y="194">
          <tspan class="term-prompt">❯ </tspan>
          <rect x="18" y="182" width="7" height="13" class="cursor" />
        </text>
      </g>
    </g>
  
    <g class="skills-container">
      <g transform="translate(30, 275)">
        <rect width="66" height="24" class="skill-badge" />
        <text x="33" y="16" text-anchor="middle" class="skill-text">Svelte</text>
      </g>
    
      <g transform="translate(104, 275)">
        <rect width="94" height="24" class="skill-badge" />
        <text x="47" y="16" text-anchor="middle" class="skill-text">JavaScript</text>
      </g>
    
      <g transform="translate(206, 275)">
        <rect width="73" height="24" class="skill-badge" />
        <text x="36.5" y="16" text-anchor="middle" class="skill-text">Node.js</text>
      </g>
    
      <g transform="translate(287, 275)">
        <rect width="73" height="24" class="skill-badge" />
        <text x="36.5" y="16" text-anchor="middle" class="skill-text">Express</text>
      </g>
    
      <g transform="translate(368, 275)">
        <rect width="94" height="24" class="skill-badge" />
        <text x="47" y="16" text-anchor="middle" class="skill-text">PostgreSQL</text>
      </g>
    
      <g transform="translate(470, 275)">
        <rect width="73" height="24" class="skill-badge" />
        <text x="36.5" y="16" text-anchor="middle" class="skill-text">Flutter</text>
      </g>
    </g>
    
    <rect x="510" y="30" width="310" height="280" rx="12" class="glass-panel" />
  
    
    <g transform="translate(500, 25)">

      <!-- 💭 GLOBO DE PENSAMIENTOS DE BYTE -->
      <g transform="translate(45, 10)">
        <path d="M 10 30 Q 0 30 0 20 L 0 -15 Q 0 -25 10 -25 L 180 -25 Q 190 -25 190 -15 L 190 20 Q 190 30 180 30 L 50 30 L 35 42 L 38 30 Z" class="thought-bubble" />

        <g class="t-step-1">
          <text x="95" y="-5" class="thought-text">zZ</text>
          <text x="95" y="12" class="thought-sub">Dreaming about code...</text>
        </g>

        <g class="t-step-2">
          <text x="95" y="-5" class="thought-text">zZ</text>
          <text x="95" y="12" class="thought-sub">Thinking in Python...</text>
        </g>

        <g class="t-step-3">
          <text x="95" y="-5" class="thought-text">zZ</text>
          <text x="95" y="12" class="thought-sub">Compiling dreams...</text>
        </g>

        <g class="t-step-4">
          <text x="95" y="-5" class="thought-text">zZ</text>
          <text x="95" y="12" class="thought-sub">One more commit...</text>
        </g>
      </g>

      <!-- 🐱 BYTE EL GATO -->
      <g transform="translate(50, 85)">
        <path d="M 180 135 C 200 135, 205 105, 190 100 C 185 98, 180 110, 175 125 Z" fill="#8b949e" class="cat-tail" />
        <ellipse cx="120" cy="130" rx="55" ry="32" fill="#21262d" stroke="rgba(48, 54, 61, 0.8)" stroke-width="1.5" />
        <circle cx="75" cy="125" r="26" fill="#21262d" stroke="rgba(48, 54, 61, 0.8)" stroke-width="1.5" />

        <path d="M 58 106 L 50 86 L 70 98 Z" fill="#21262d" stroke="rgba(48, 54, 61, 0.8)" stroke-width="1.5" />
        <path d="M 60 104 L 54 90 L 68 98 Z" fill="#58a6ff" opacity="0.6" />

        <path d="M 80 101 L 88 82 L 94 104 Z" fill="#21262d" stroke="rgba(48, 54, 61, 0.8)" stroke-width="1.5" />
        <path d="M 82 100 L 87 87 L 92 102 Z" fill="#58a6ff" opacity="0.6" />

        <path d="M 62 124 Q 67 130 72 124" fill="none" stroke="#f0f6fc" stroke-width="2" stroke-linecap="round" />
        <path d="M 78 124 Q 83 130 88 124" fill="none" stroke="#f0f6fc" stroke-width="2" stroke-linecap="round" />

        <polygon points="74,129 78,129 76,132" fill="#58a6ff" />
        <line x1="52" y1="126" x2="62" y2="128" stroke="#8b949e" stroke-width="1" />
        <line x1="50" y1="132" x2="62" y2="131" stroke="#8b949e" stroke-width="1" />
        <line x1="90" y1="128" x2="100" y2="126" stroke="#8b949e" stroke-width="1" />
        <line x1="90" y1="131" x2="100" y2="132" stroke="#8b949e" stroke-width="1" />

        <g transform="translate(35, 110)">
          
    <!-- Laptop -->
    <g transform="translate(0, 0)">
      <path d="M 25 10 L 75 10 L 80 45 L 20 45 Z" fill="#161b22" stroke="rgba(48, 54, 61, 0.8)" stroke-width="1.2" />
      <circle cx="50" cy="26" r="3.5" fill="#58a6ff" opacity="0.9" />
      <path d="M 12 45 L 88 45 L 84 50 L 16 50 Z" fill="rgba(48, 54, 61, 0.8)" />
    </g>

    <!-- Taza de Café -->
    <g transform="translate(98, 26)">
      <path d="M 4 0 Q 2 -4 4 -8" class="steam" />
      <path d="M 9 -1 Q 11 -5 9 -9" class="steam steam-2" />
      <rect x="0" y="0" width="13" height="15" rx="3" fill="rgba(22, 27, 34, 0.75)" stroke="rgba(48, 54, 61, 0.8)" stroke-width="1" />
      <path d="M 13 3 C 17 3, 17 11, 13 11" fill="none" stroke="rgba(48, 54, 61, 0.8)" stroke-width="1" />
    </g>
  
        </g>
      </g>

    </g>
  
  
</svg>